name: Export HiBid auction

on:
  workflow_dispatch:
    inputs:
      auction_id:
        description: "HiBid auction ID"
        required: true
        default: "776304"

permissions:
  contents: write

concurrency:
  group: hibid-export-${{ inputs.auction_id }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependency
        run: python -m pip install --upgrade curl_cffi

      - name: Export HiBid auction
        run: python scripts/export_hibid.py "${{ inputs.auction_id }}"

      - name: Commit auction snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "auctions/${{ inputs.auction_id }}/README.md" \
                  "auctions/${{ inputs.auction_id }}/summary.md" \
                  "auctions/${{ inputs.auction_id }}/summary.csv" \
                  "auctions/${{ inputs.auction_id }}/lots.json"

          if git diff --cached --quiet; then
            echo "No auction changes to commit."
          else
            git commit -m "Export HiBid auction ${{ inputs.auction_id }}"
            git push
          fi
