name: Test Pioneer All-Lot Bid Updater

on:
  pull_request:
    paths:
      - "scripts/update_all_lot_bids.py"
      - "tests/test_update_all_lot_bids.py"
      - ".github/workflows/test-all-lot-bids.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install updater dependency
        run: python -m pip install curl_cffi
      - name: Test archived auction behavior without external requests
        run: python -m unittest discover -s tests -p "test_update_all_lot_bids.py" -v
