name: Update Watchlist Bids

on:
  workflow_dispatch:
  push:
    paths:
      - "watchlists/latest.json"
      - "scripts/update_watchlist_bids.py"
      - ".github/workflows/update-watchlist-bids.yml"

permissions:
  contents: write

concurrency:
  group: pioneer-watchlist-bid-updater
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install HiBid client dependency
        run: python -m pip install --upgrade curl_cffi

      - name: Refresh tracked lot bids
        run: python scripts/update_watchlist_bids.py

      - name: Commit refreshed bid state
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- watchlists/live.json)" ]; then
            echo "No watchlist bid-state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watchlists/live.json
          git commit -m "Refresh watchlist bid state"

          pushed=false
          for attempt in 1 2 3; do
            echo "Synchronizing with main (attempt $attempt/3)..."
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "Main changed during push; retrying..."
            sleep 5
          done

          if [ "$pushed" != "true" ]; then
            echo "Failed to push refreshed bid state after 3 attempts." >&2
            exit 1
          fi

      - name: Summary
        shell: bash
        run: |
          if [ -f watchlists/live.json ]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path("watchlists/live.json").read_text())
          s = data.get("summary", {})
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write("## Pioneer watchlist bid refresh\n")
              fh.write(f"- Checked: {data.get('checkedAt')}\n")
              fh.write(f"- Tracked: {s.get('trackedLots')}\n")
              fh.write(f"- Active: {s.get('activeLots')}\n")
              fh.write(f"- Closed: {s.get('closedLots')}\n")
              fh.write(f"- Changed since prior check: {s.get('changedLotsSincePreviousCheck')}\n")
              fh.write(f"- Missing: {s.get('missingLots')}\n")
          PY
          fi
