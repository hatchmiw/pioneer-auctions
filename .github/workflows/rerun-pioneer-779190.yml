name: Rerun Pioneer 779190

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rerun-pioneer-779190.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: pioneer-auction-779190-refresh
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.batches.outputs.matrix }}
      batch_count: ${{ steps.batches.outputs.batch_count }}
      retention_days: ${{ steps.retention.outputs.retention_days }}
      expired: ${{ steps.retention.outputs.expired }}
      metadata_ref: ${{ steps.commit.outputs.metadata_ref }}

    steps:
      - name: Check out current main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install exporter dependency
        run: python -m pip install --upgrade curl_cffi

      - name: Export HiBid auction
        run: python scripts/export_hibid.py "779190"

      - name: Calculate photo retention
        id: retention
        shell: bash
        run: python scripts/photo_retention.py "779190" >> "$GITHUB_OUTPUT"

      - name: Build 100-lot photo batches
        id: batches
        shell: bash
        run: python scripts/photo_batches.py "779190" 100 >> "$GITHUB_OUTPUT"

      - name: Commit permanent auction metadata
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "auctions/779190/README.md"                   "auctions/779190/summary.md"                   "auctions/779190/summary.csv"                   "auctions/779190/lots.json"                   "auctions/779190/photo-batches.json"

          if ! git diff --cached --quiet; then
            git commit -m "Run Pioneer auction 779190"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

          echo "metadata_ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  photos:
    needs: metadata
    if: needs.metadata.outputs.expired != 'true' && needs.metadata.outputs.batch_count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.metadata.outputs.matrix) }}

    steps:
      - name: Check out exact auction snapshot
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.metadata.outputs.metadata_ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Mirror batch ${{ matrix.batch.label }}
        run: python scripts/mirror_photos.py "779190" "${{ matrix.batch.start }}" "${{ matrix.batch.end }}"

      - name: Upload photo batch
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.batch.artifact_name }}
          path: auctions/779190/photo_batches/${{ matrix.batch.label }}/
          retention-days: ${{ needs.metadata.outputs.retention_days }}
          compression-level: 0
          if-no-files-found: error
