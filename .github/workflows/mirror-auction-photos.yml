name: Mirror auction photos

on:
  workflow_dispatch:
    inputs:
      auction_id:
        description: "HiBid auction ID"
        required: true
        default: "776304"

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Mirror photos
        run: python scripts/mirror_photos.py "${{ inputs.auction_id }}"

      - name: Commit mirrored photos
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "auctions/${{ inputs.auction_id }}/photos"

          if git diff --cached --quiet; then
            echo "No photo changes to commit."
          else
            git commit -m "Mirror Pioneer/HiBid auction ${{ inputs.auction_id }} photos"
            git push
          fi
