name: Mirror auction photos

on:
  workflow_dispatch:
    inputs:
      auction_id:
        description: "HiBid auction ID"
        required: true
        default: "776304"

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Calculate photo retention
        id: retention
        shell: bash
        run: python scripts/photo_retention.py "${{ inputs.auction_id }}" >> "$GITHUB_OUTPUT"

      - name: Mirror photos
        run: python scripts/mirror_photos.py "${{ inputs.auction_id }}"

      - name: Upload temporary photo archive
        uses: actions/upload-artifact@v4
        with:
          name: pioneer-${{ inputs.auction_id }}-photos
          path: auctions/${{ inputs.auction_id }}/photos/
          retention-days: ${{ steps.retention.outputs.retention_days }}
          compression-level: 0
          if-no-files-found: error

      - name: Summary
        shell: bash
        run: |
          echo "Temporary photo artifact created for auction ${{ inputs.auction_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Delete after (UTC): ${{ steps.retention.outputs.cleanup_at }}" >> "$GITHUB_STEP_SUMMARY"
