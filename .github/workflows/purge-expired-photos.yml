name: Purge expired auction photos

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Find auctions past closing plus seven days
        shell: bash
        run: |
          python scripts/photo_retention.py --due > /tmp/expired-auctions.txt
          echo "Expired auction IDs:"
          cat /tmp/expired-auctions.txt

      - name: Delete expired photo artifacts and legacy folders
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          while IFS= read -r auction_id; do
            [ -n "$auction_id" ] || continue
            artifact_prefix="pioneer-$auction_id-photos"
            echo "Checking expired auction $auction_id"

            gh api --paginate \
              "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | [.id, .name] | @tsv' |
            while IFS=
            if [ -d "auctions/$auction_id/photos" ]; then
              echo "Removing legacy committed photo folder for auction $auction_id"
              git rm -r -q "auctions/$auction_id/photos"
            fi
          done < /tmp/expired-auctions.txt

          if git diff --cached --quiet; then
            echo "No legacy photo folders to remove."
          else
            git commit -m "Purge expired Pioneer auction photos"
            git pull --rebase origin main
            git push
          fi
\t' read -r artifact_id artifact_name; do
              [ -n "$artifact_id" ] || continue
              if [[ "$artifact_name" == "$artifact_prefix"* ]]; then
                echo "Deleting artifact $artifact_name ($artifact_id)"
                gh api --method DELETE \
                  "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
              fi
            done

            if [ -d "auctions/$auction_id/photos" ]; then
              echo "Removing legacy committed photo folder for auction $auction_id"
              git rm -r -q "auctions/$auction_id/photos"
            fi
          done < /tmp/expired-auctions.txt

          if git diff --cached --quiet; then
            echo "No legacy photo folders to remove."
          else
            git commit -m "Purge expired Pioneer auction photos"
            git pull --rebase origin main
            git push
          fi
