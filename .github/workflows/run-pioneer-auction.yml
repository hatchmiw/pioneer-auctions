name: Run Pioneer Auction

on:
  workflow_dispatch:
    inputs:
      auction_id:
        description: "HiBid auction ID"
        required: true
        default: "776304"

permissions:
  contents: write

concurrency:
  group: pioneer-auction-${{ inputs.auction_id }}
  cancel-in-progress: false

jobs:
  run-auction:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade curl_cffi pillow

      - name: Export HiBid auction
        run: python scripts/export_hibid.py "${{ inputs.auction_id }}"

      - name: Calculate photo retention
        id: retention
        shell: bash
        run: python scripts/photo_retention.py "${{ inputs.auction_id }}" >> "$GITHUB_OUTPUT"

      - name: Mirror all lot photos
        if: steps.retention.outputs.expired != 'true'
        run: python scripts/mirror_photos.py "${{ inputs.auction_id }}"

      - name: Verify generated files
        if: steps.retention.outputs.expired != 'true'
        shell: bash
        run: |
          test -s "auctions/${{ inputs.auction_id }}/README.md"
          test -s "auctions/${{ inputs.auction_id }}/summary.md"
          test -s "auctions/${{ inputs.auction_id }}/summary.csv"
          test -s "auctions/${{ inputs.auction_id }}/lots.json"
          test -s "auctions/${{ inputs.auction_id }}/photos/README.md"
          test -s "auctions/${{ inputs.auction_id }}/photos/manifest.json"
          echo "Auction export and photo mirror verified."

      - name: Upload temporary photo archive
        if: steps.retention.outputs.expired != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pioneer-${{ inputs.auction_id }}-photos
          path: auctions/${{ inputs.auction_id }}/photos/
          retention-days: ${{ steps.retention.outputs.retention_days }}
          compression-level: 0
          if-no-files-found: error

      - name: Commit permanent auction metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "auctions/${{ inputs.auction_id }}/README.md" \
                  "auctions/${{ inputs.auction_id }}/summary.md" \
                  "auctions/${{ inputs.auction_id }}/summary.csv" \
                  "auctions/${{ inputs.auction_id }}/lots.json"

          if git diff --cached --quiet; then
            echo "No metadata changes to commit."
          else
            git commit -m "Run Pioneer auction ${{ inputs.auction_id }}"
            # Long-running photo jobs may finish after another commit lands on main.
            # Rebase metadata-only changes onto the newest main and retry if needed.
            for attempt in 1 2 3; do
              echo "Synchronizing with main (attempt $attempt/3)..."
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Auction metadata committed and pushed."
                exit 0
              fi
              echo "Main changed during push; retrying..."
              sleep 5
            done
            echo "Failed to push after 3 attempts." >&2
            exit 1
          fi

      - name: Summary
        shell: bash
        run: |
          echo "## Pioneer auction ${{ inputs.auction_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Metadata committed. Photos artifact uploaded only if the seven-day post-close window remains open." >> "$GITHUB_STEP_SUMMARY"
          echo "Auction close (UTC): ${{ steps.retention.outputs.auction_close }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Delete photos after (UTC): ${{ steps.retention.outputs.cleanup_at }}" >> "$GITHUB_STEP_SUMMARY"
