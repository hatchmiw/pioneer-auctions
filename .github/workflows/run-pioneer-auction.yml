name: Run Pioneer Auction

on:
  workflow_dispatch:
    inputs:
      auction_id:
        description: "HiBid auction ID"
        required: true
        default: "776304"

permissions:
  contents: write

concurrency:
  group: pioneer-auction-${{ inputs.auction_id }}
  cancel-in-progress: false

jobs:
  run-auction:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade curl_cffi pillow

      - name: Export HiBid auction
        run: python scripts/export_hibid.py "${{ inputs.auction_id }}"

      - name: Mirror all lot photos
        run: python scripts/mirror_photos.py "${{ inputs.auction_id }}"

      - name: Verify generated files
        shell: bash
        run: |
          test -s "auctions/${{ inputs.auction_id }}/README.md"
          test -s "auctions/${{ inputs.auction_id }}/summary.md"
          test -s "auctions/${{ inputs.auction_id }}/summary.csv"
          test -s "auctions/${{ inputs.auction_id }}/lots.json"
          test -s "auctions/${{ inputs.auction_id }}/photos/README.md"
          test -s "auctions/${{ inputs.auction_id }}/photos/manifest.json"
          echo "Auction export and photo mirror verified."

      - name: Commit complete auction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "auctions/${{ inputs.auction_id }}"

          if git diff --cached --quiet; then
            echo "No auction changes to commit."
          else
            git commit -m "Run Pioneer auction ${{ inputs.auction_id }}"
            git push
          fi
